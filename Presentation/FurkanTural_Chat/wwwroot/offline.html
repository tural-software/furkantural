<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Çevrimdışı - Tural Chat</title>
    <style>
        :root { color-scheme: dark; }
        html, body {
            height: 100%; margin: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0f1117; color: #f9fafb;
        }
        .wrap {
            min-height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; padding: 24px;
        }
        .logo {
            width: 72px; height: 72px; border-radius: 18px; background: #38bdf8;
            display: grid; place-items: center; color: #0f1117; font-weight: 800; font-size: 26px;
            margin-bottom: 20px;
        }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { color: #9ca3af; font-size: 14px; margin: 0 0 22px; max-width: 320px; line-height: 1.5; }
        button {
            background: #38bdf8; color: #0f172a; border: 0; border-radius: 12px;
            padding: 11px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        button:hover { filter: brightness(1.05); }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="logo">TC</div>
        <h1>Çevrimdışısın</h1>
        <p>İnternet bağlantısı kurulamadı. Bağlantın geri geldiğinde tekrar deneyebilirsin.</p>
        <button type="button" onclick="location.reload()">Tekrar dene</button>
    </div>
</body>
</html>
