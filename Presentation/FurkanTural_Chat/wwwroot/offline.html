<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Çevrimdışı - Chatural</title>
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/chat.css" />
</head>
<body>
    <div class="shell">
        <main id="main" class="status-wrap">
            <div class="status-icon" aria-hidden="true">⇅</div>

            <p class="status-kicker">Çevrimdışı</p>

            <h1 class="status-title">Çevrimdışısın</h1>

            <p class="status-text">
                İnternet bağlantısı kurulamadı. Bağlantın geri geldiğinde tekrar deneyebilirsin.
            </p>

            <div class="status-actions">
                <button type="button" class="btn-primary status-btn" data-offline-retry>Tekrar dene</button>
            </div>

            <p class="status-conn" role="status">
                <span class="status-conn-dot" aria-hidden="true"></span>Bağlantı yok · yeniden deniyor
            </p>
        </main>
    </div>

    <script src="/js/theme.js"></script>
    <script src="/js/offline.js"></script>
</body>
</html>
